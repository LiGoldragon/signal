[package]
name         = "signal"
version      = "3.0.2"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal"
description  = "The shared Signal layer: the portable rkyv Signal frame, its wire framing, and the cross-component taxonomy every Nexus depends on."
publish      = false
links        = "signal"
build        = "build.rs"

[lib]
name = "signal"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]
transport = ["dep:tokio"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "de3d9928b156f2e1a92d060b7817af201abfdbef" }

[[test]]
name = "current_contract"
path = "tests/current_contract.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
